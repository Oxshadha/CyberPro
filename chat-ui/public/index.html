<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberPro - SOC Assistant</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <script>mermaid.initialize({ startOnLoad: false, theme: 'dark', flowchart: { htmlLabels: false } });</script>
</head>
<body>
    <div class="chat-container">
        <header class="chat-header">
            <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                <div>
                    <div class="logo">
                        <div class="logo-icon"></div>
                        <h1>CyberPro</h1>
                    </div>
                    <p>Advanced SOC Triage Assistant</p>
                </div>
                <button id="new-chat-btn" style="padding: 8px 16px; background: transparent; border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; color: white; cursor: pointer; font-family: 'Inter', sans-serif; transition: all 0.2s;">
                    + New Conversation
                </button>
            </div>
        </header>

        <main class="chat-box" id="chat-box">
            <div class="message ai-message">
                <div class="message-content">
                    Hello! I am CyberPro, your AI SOC Triage Assistant. Describe any suspicious network events you are experiencing, and I will analyze the threat for you.
                    <br><br>
                    *Examples: "port scan", "malware signature", "data exfiltration", "suspicious login"*
                </div>
            </div>
        </main>

        <div class="input-area">
            <input type="text" id="user-input" placeholder="Describe the security events here..." autocomplete="off">
            <button id="send-btn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
