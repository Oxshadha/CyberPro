<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberPro - Diagnostic Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>mermaid.initialize({ startOnLoad: false, theme: 'dark', flowchart: { htmlLabels: false } });</script>
</head>
<body>
    <header class="app-header">
        <div class="logo">
            <i data-lucide="shield-check" class="logo-icon"></i>
            <h1>CyberPro Security Diagnostic System</h1>
        </div>
        <div class="header-actions">
            <button id="toggle-terminal-btn" class="outline-btn"><i data-lucide="terminal"></i> Toggle Terminal</button>
            <button id="reset-btn" class="outline-btn"><i data-lucide="plus-circle"></i> New Diagnosis</button>
        </div>
    </header>

    <div class="dashboard-container">
        <!-- LEFT COLUMN: Diagnostic Wizard -->
        <div class="wizard-panel">
            
            <!-- SCREEN 1: Initial Observation -->
            <div id="screen-initial" class="wizard-screen active">
                <h2>Step 1: Primary Observation</h2>
                <p class="subtitle">Select the primary anomaly you are observing on the network.</p>
                
                <div class="symptom-grid">
                    <button class="symptom-card" data-symptom="service_unavailable">
                        <h3><i data-lucide="server-crash"></i> Network / Service Offline</h3>
                        <p>Websites are unreachable or timing out.</p>
                    </button>
                    <button class="symptom-card" data-symptom="database_errors">
                        <h3><i data-lucide="database"></i> Database Crashing</h3>
                        <p>SQL syntax errors or DB connection drops.</p>
                    </button>
                    <button class="symptom-card" data-symptom="files_encrypted">
                        <h3><i data-lucide="lock"></i> Inaccessible Files</h3>
                        <p>Files won't open or have strange extensions.</p>
                    </button>
                    <button class="symptom-card" data-symptom="unusual_login_times">
                        <h3><i data-lucide="clock"></i> Strange Login Times</h3>
                        <p>Users logging in at 3 AM or from unusual places.</p>
                    </button>
                    <button class="symptom-card" data-symptom="port_scan">
                        <h3><i data-lucide="shield-alert"></i> Repeated Connection Attempts</h3>
                        <p>Firewall is blocking sequential port requests.</p>
                    </button>
                    <button class="symptom-card" data-symptom="suspicious_emails_reported">
                        <h3><i data-lucide="mail-warning"></i> Suspicious Emails</h3>
                        <p>Employees are reporting strange urgent emails.</p>
                    </button>
                    <button class="symptom-card" data-symptom="high_cpu_usage">
                        <h3><i data-lucide="cpu"></i> 100% CPU Usage</h3>
                        <p>Servers are running extremely hot and slow.</p>
                    </button>
                    <button class="symptom-card" data-symptom="spike_outbound_traffic">
                        <h3><i data-lucide="upload-cloud"></i> Massive Outbound Traffic</h3>
                        <p>Huge amounts of data are leaving the network suddenly.</p>
                    </button>
                    <button class="symptom-card" data-symptom="homepage_changed">
                        <h3><i data-lucide="palette"></i> Website Defacement</h3>
                        <p>Public homepage replaced with hacker message.</p>
                    </button>
                </div>
            </div>

            <!-- SCREEN 2: Ask Follow-up -->
            <div id="screen-ask" class="wizard-screen hidden">
                <h2>Step 2: Refining Diagnosis</h2>
                <div class="ask-card">
                    <p id="ask-prompt" class="prompt-text">Loading...</p>
                    <div class="button-group">
                        <button id="btn-yes" class="action-btn yes-btn">YES</button>
                        <button id="btn-no" class="action-btn no-btn">NO</button>
                    </div>
                </div>
            </div>

            <!-- SCREEN 3: Result -->
            <div id="screen-result" class="wizard-screen hidden">
                <div id="result-content" class="result-content"></div>
            </div>

        </div>

        <!-- RIGHT COLUMN: Live Prolog Terminal -->
        <div class="terminal-panel">
            <div class="terminal-header">
                <span class="dot red"></span>
                <span class="dot yellow"></span>
                <span class="dot green"></span>
                <span class="terminal-title">swipl — Inference Engine Logs</span>
            </div>
            <pre id="terminal-log" class="terminal-log"></pre>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
